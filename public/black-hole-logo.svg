<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="75%" stop-color="#e879f9" stop-opacity="0.45"/>
      <stop offset="90%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="38%" stop-color="#0a0a12"/>
      <stop offset="52%" stop-color="#1e1b4b"/>
      <stop offset="62%" stop-color="#67e8f9"/>
      <stop offset="72%" stop-color="#f0abfc"/>
      <stop offset="82%" stop-color="#22d3ee"/>
      <stop offset="92%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Soft outer glow so the mark reads on dark nebula backgrounds -->
  <circle cx="64" cy="64" r="62" fill="url(#glow)"/>
  <circle cx="64" cy="64" r="56" fill="url(#disk)" filter="url(#softGlow)"/>
  <!-- Bright accretion ring stroke -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#67e8f9" stroke-width="2.5" opacity="0.95"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#e879f9" stroke-width="1.25" opacity="0.85" stroke-dasharray="8 4"/>
  <!-- Event horizon -->
  <circle cx="64" cy="64" r="18" fill="#050508"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
</svg>
